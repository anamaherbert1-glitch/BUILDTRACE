<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#082746">
<title>BUILDTRACE — Donner une seconde vie aux matériaux</title>
<style>
:root{--navy:#082746;--navy2:#0b355b;--green:#08b83f;--green2:#00d34a;--ink:#10243a;--muted:#6d7c8d;--line:#dce4ec;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}body{min-height:100svh;background:#f7f9fb}button,input{font:inherit}button{cursor:pointer}.screen{display:none;min-height:100svh}.screen.active{display:flex}.svg-defs{position:absolute;width:0;height:0;overflow:hidden}.brand{display:flex;align-items:center;justify-content:center;gap:0;flex-direction:column;color:#fff;font-weight:950;letter-spacing:-1.8px;font-size:clamp(27px,7vw,39px);line-height:1}.brand-name span{color:#10d448}.brand-logo{width:90px;height:84px;filter:drop-shadow(0 4px 7px #00152c55)}.icon{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#welcome{position:relative;overflow:hidden;flex-direction:column;justify-content:space-between;padding:clamp(30px,7vh,68px) 26px max(27px,env(safe-area-inset-bottom));color:white;background:linear-gradient(180deg,#0627473d 0%,#06274720 32%,#05213be8 66%,#041a31 100%),url('https://images.unsplash.com/photo-1504307651254-35680f356dfd?auto=format&fit=crop&w=1400&q=90') center 38%/cover no-repeat}
#welcome:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#06274730,transparent 60%);pointer-events:none}#welcome>*{position:relative;z-index:1}.welcome-top{display:flex;justify-content:center}.welcome-middle{margin-top:auto;margin-bottom:23px;text-align:center}.welcome-middle h1{font-size:clamp(23px,6vw,30px);line-height:1.15;letter-spacing:-.7px;margin:0 auto 22px;max-width:350px;text-shadow:0 2px 8px #00172c}.benefits{display:grid;gap:10px;width:max-content;max-width:100%;margin:0 auto;text-align:left;font-weight:750;font-size:15px}.benefit{display:flex;align-items:center;gap:11px}.check{width:22px;height:22px;border-radius:50%;background:#08c947;color:#fff;display:grid;place-items:center;box-shadow:0 2px 7px #001b2b70}.check svg{width:14px;height:14px;stroke-width:3}.welcome-actions{display:grid;gap:10px;width:100%;max-width:370px;margin:0 auto}.btn{min-height:49px;border-radius:28px;border:0;font-weight:850;letter-spacing:-.15px;padding:0 20px}.btn-green{background:linear-gradient(100deg,#05bd37,#00a92f);color:#fff;box-shadow:0 6px 18px #00a93845}.btn-glass{background:#041b31a6;color:#fff;border:1.5px solid #fff}.arrow{font-size:19px;margin-left:5px}.screen-auth{width:100%;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;overflow:hidden;padding:clamp(18px,4vh,34px) 24px max(12px,env(safe-area-inset-bottom));background:#fff}.auth-brand{color:var(--navy);font-size:29px;gap:0;margin-bottom:5px}.auth-brand .brand-logo{width:72px;height:65px;filter:none}.auth-brand .brand-name span{color:#0bb83f}.auth-title{font-size:21px;font-weight:900;letter-spacing:-.55px;margin:3px 0 17px;color:#061d37;text-align:center}.auth-form{width:100%;max-width:390px;display:flex;flex-direction:column;gap:9px;z-index:1}.social-btn{height:48px;border:1px solid #d8e0e9;background:#fff;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:13px;color:#101b2a;font-weight:750;font-size:14px;box-shadow:0 3px 8px #112b4410}.social-btn svg{width:21px;height:21px}.divider{display:flex;align-items:center;gap:12px;color:#182c40;font-size:13px;font-weight:750;margin:1px 0}.divider:before,.divider:after{content:"";height:1px;background:#e4e9ef;flex:1}.input-wrap{height:49px;border:1px solid #d6dfe8;border-radius:27px;display:flex;align-items:center;gap:12px;padding:0 16px;color:#142e48;box-shadow:0 2px 7px #112b4408}.input-wrap:focus-within{border-color:#0ab842;box-shadow:0 0 0 3px #08b83f18}.input-wrap input{border:0;outline:0;min-width:0;flex:1;background:transparent;color:#10243a;font-size:14px}.input-wrap input::placeholder{color:#65758a}.input-wrap .icon{width:20px;height:20px}.eye{border:0;background:none;padding:4px;color:#18334e;display:grid;place-items:center}.submit{height:49px;border-radius:27px;margin-top:3px;background:linear-gradient(100deg,#05bd37,#00a72f);color:white;border:0;font-weight:900;box-shadow:0 5px 15px #00a93830}.auth-switch{text-align:center;color:#25374a;font-size:12px;margin:0}.text-link{color:#079c36;font-weight:850;border:0;background:none;padding:0}.auth-footer{position:absolute;bottom:0;left:0;width:100%;height:94px;pointer-events:none;z-index:0}.auth-footer svg{width:100%;height:100%;display:block}.auth-form,.auth-title,.auth-brand{position:relative;z-index:1}.auth-error{display:none;color:#a51f28;background:#fff0f0;border-radius:10px;padding:9px 12px;font-size:12px}.auth-error.show{display:block}.forgot{border:0;background:none;color:#073d70;font-weight:750;font-size:13px;padding:5px}.login-screen{background:linear-gradient(160deg,#062344 0%,#0a3459 44%,#fff 44%,#fff 100%);padding-top:24px}.login-screen .auth-brand{color:#fff;margin-bottom:8px}.login-screen .auth-title{color:#fff;margin:0 0 25px}.login-panel{width:min(440px,calc(100% + 48px));background:#fff;border-radius:22px 22px 0 0;padding:19px 24px 28px;display:flex;justify-content:center;flex:1;box-shadow:0 -4px 22px #001d3810}.login-panel .auth-form{max-width:390px}.login-panel .auth-footer{height:74px}.login-topback{position:absolute;top:26px;left:20px;color:#b8d2e5;background:none;border:0;padding:6px}.login-topback svg{width:22px;height:22px}.splash{background:#082746;align-items:center;justify-content:center}.splash .brand{animation:pop .7s ease both}@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}@media(max-height:720px){.screen-auth{padding-top:12px}.auth-brand .brand-logo{width:58px;height:53px}.auth-title{margin-bottom:10px}.auth-form{gap:7px}.social-btn,.input-wrap,.submit{height:44px;min-height:44px}.auth-footer{height:65px}.login-screen{padding-top:15px}.login-screen .auth-title{margin-bottom:13px}.login-panel{padding-top:14px}}@media(min-width:700px){.screen-auth{justify-content:center}.auth-footer{height:115px}.login-panel{flex:none;border-radius:22px;max-width:480px;padding:26px 34px;margin-bottom:8vh}.login-screen{justify-content:flex-start;padding-top:38px}.login-screen .auth-title{margin-bottom:22px}}
</style>
</head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg">
<symbol id="bt-logo-dark" viewBox="0 0 120 110"><path d="M12 99V43l31-18v74M43 99V13L72 3v96" stroke="#082746" stroke-width="7" fill="none" stroke-linejoin="round"/><path d="M72 99V42l32-18v75" stroke="#08b83f" stroke-width="8" fill="none" stroke-linejoin="round"/><path d="M4 103h110" stroke="#082746" stroke-width="5" stroke-linecap="round"/><path d="M30 53v30M59 28v57M87 51v34" stroke="#082746" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="bt-logo" viewBox="0 0 120 110"><path d="M12 99V43l31-18v74M43 99V13L72 3v96" stroke="#fff" stroke-width="7" fill="none" stroke-linejoin="round"/><path d="M72 99V42l32-18v75" stroke="#08cf45" stroke-width="8" fill="none" stroke-linejoin="round"/><path d="M4 103h110" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M30 53v30M59 28v57M87 51v34" stroke="#fff" stroke-width="4" stroke-linecap="round"/></symbol>
<symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
<symbol id="lock" viewBox="0 0 24 24"><circle cx="11" cy="12" r="8"/><path d="M11 8v4l3 2M18 18l3 3"/></symbol>
<symbol id="eye" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="eye-off" viewBox="0 0 24 24"><path d="m3 3 18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a16 16 0 0 1-3 3.8M6.2 6.2C3.5 8 2 12 2 12s3.5 7 10 7a10 10 0 0 0 3-.5"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
</svg>
<section id="welcome" class="screen active">
 <div class="welcome-top"><div class="brand"><svg class="brand-logo"><use href="#bt-logo"/></svg><div class="brand-name">BUILD<span>TRACE</span></div></div></div>
 <div class="welcome-middle"><h1>Donnez une seconde vie<br>aux matériaux de construction</h1><div class="benefits"><div class="benefit"><span class="check"><svg class="icon"><use href="#check"/></svg></span> Achetez <span style="color:#08d64c">•</span> Louez <span style="color:#08d64c">•</span> Réutilisez</div><div class="benefit"><span class="check"><svg class="icon"><use href="#check"/></svg></span> Réduisez les déchets</div><div class="benefit"><span class="check"><svg class="icon"><use href="#check"/></svg></span> Construisez durablement</div></div></div>
 <div class="welcome-actions"><button class="btn btn-green" id="startSignup">Commencer gratuitement <span class="arrow">→</span></button><button class="btn btn-glass" id="startLogin">Se connecter</button></div>
</section>
<section id="signup" class="screen screen-auth">
 <div class="brand auth-brand"><svg class="brand-logo"><use href="#bt-logo-dark"/></svg><div class="brand-name">BUILD<span>TRACE</span></div></div>
 <h1 class="auth-title">Créez votre compte</h1>
 <form id="signupForm" class="auth-form">
  <button type="button" class="social-btn" data-provider="Google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#FF3D00" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#4CAF50" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/><path fill="#1976D2" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/></svg>Continuer avec Google</button>
  <button type="button" class="social-btn" data-provider="Apple"><svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor"><path d="M16.7 12.8c0-2.3 1.9-3.4 2-3.5a4.4 4.4 0 0 0-3.5-1.9c-1.5-.2-2.9.9-3.7.9s-2-.9-3.3-.9a4.9 4.9 0 0 0-4.1 2.5c-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.5 1.3-.1 1.8-.8 3.4-.8s2.1.8 3.4.8 2.2-1.2 3.1-2.5a11 11 0 0 0 1.4-2.9 4.2 4.2 0 0 1-3.2-4.4ZM14.2 5.8A4.3 4.3 0 0 0 15.2 2a4.5 4.5 0 0 0-3.1 1.6 4.1 4.1 0 0 0-1 3.6 3.8 3.8 0 0 0 3.1-1.4Z"/></svg>Continuer avec Apple</button>
  <div class="divider">ou</div>
  <label class="input-wrap"><svg class="icon"><use href="#mail"/></svg><input id="signupEmail" type="email" placeholder="Email" autocomplete="email" required></label>
  <label class="input-wrap"><svg class="icon"><use href="#lock"/></svg><input id="signupPassword" type="password" placeholder="Mot de passe" autocomplete="new-password" minlength="8" required><button class="eye" type="button" data-toggle="signupPassword" aria-label="Afficher le mot de passe"><svg class="icon"><use href="#eye"/></svg></button></label>
  <div id="signupError" class="auth-error"></div>
  <button class="submit" type="submit">S'inscrire</button>
  <p class="auth-switch">Vous avez déjà un compte ? <button type="button" class="text-link" id="toLogin">Se connecter</button></p>
 </form>
 <div class="auth-footer" aria-hidden="true"><svg viewBox="0 0 420 100" preserveAspectRatio="none"><defs><linearGradient id="city" x2="0" y2="1"><stop stop-color="#075b8d"/><stop offset="1" stop-color="#092746"/></linearGradient></defs><path d="M0 74 22 64 38 71 57 47 71 59 90 43 106 62 125 49 145 65 164 36 182 55 202 44 219 66 239 31 257 54 277 41 297 65 318 46 338 61 358 34 378 58 398 45 420 63V100H0Z" fill="url(#city)"/><path d="M0 85 30 72v28H0M65 75h24v25H65M105 68h31v32h-31M171 70h20v30h-20M226 62h29v38h-29M286 73h23v27h-23M345 68h32v32h-32" fill="#0a416b"/><path d="M0 92q22-19 42 0t42 0 42 0 42 0 42 0 42 0 42 0 42 0 42 0 42 0 42 0 42 0 42 0" fill="none" stroke="#11bf4b" stroke-width="3"/></svg></div>
</section>
<section id="login" class="screen screen-auth login-screen">
 <button class="login-topback" id="backFromLogin" aria-label="Retour"><svg class="icon"><use href="#back"/></svg></button>
 <div class="brand auth-brand"><svg class="brand-logo"><use href="#bt-logo"/></svg><div class="brand-name">BUILD<span>TRACE</span></div></div>
 <h1 class="auth-title">Bienvenue !<div style="font-size:14px;font-weight:500;letter-spacing:0;margin-top:4px">Connectez-vous à votre compte</div></h1>
 <div class="login-panel"><form id="loginForm" class="auth-form">
  <button type="button" class="social-btn" data-provider="Google"><svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.6c3.9-3.6 6.1-8.8 6.1-15Z"/><path fill="#FF3D00" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.6-5.1c-1.8 1.2-4.1 2-6.9 2-5.3 0-9.8-3.6-11.4-8.4H5.8v5.3A20 20 0 0 0 24 44Z"/><path fill="#4CAF50" d="M12.6 27.6a12 12 0 0 1 0-7.2v-5.3H5.8a20 20 0 0 0 0 17.8l6.8-5.3Z"/><path fill="#1976D2" d="M24 12c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 6 29.5 4 24 4A20 20 0 0 0 5.8 15.1l6.8 5.3C14.2 15.6 18.7 12 24 12Z"/></svg>Continuer avec Google</button>
  <button type="button" class="social-btn" data-provider="Apple"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.7 12.8c0-2.3 1.9-3.4 2-3.5a4.4 4.4 0 0 0-3.5-1.9c-1.5-.2-2.9.9-3.7.9s-2-.9-3.3-.9a4.9 4.9 0 0 0-4.1 2.5c-1.8 3.1-.5 7.7 1.3 10.2.9 1.2 1.9 2.6 3.2 2.5 1.3-.1 1.8-.8 3.4-.8s2.1.8 3.4.8 2.2-1.2 3.1-2.5a11 11 0 0 0 1.4-2.9 4.2 4.2 0 0 1-3.2-4.4ZM14.2 5.8A4.3 4.3 0 0 0 15.2 2a4.5 4.5 0 0 0-3.1 1.6 4.1 4.1 0 0 0-1 3.6 3.8 3.8 0 0 0 3.1-1.4Z"/></svg>Continuer avec Apple</button>
  <div class="divider">ou</div>
  <label class="input-wrap"><svg class="icon"><use href="#mail"/></svg><input id="loginEmail" type="email" placeholder="Email" autocomplete="email" required></label>
  <label class="input-wrap"><svg class="icon"><use href="#lock"/></svg><input id="loginPassword" type="password" placeholder="Mot de passe" autocomplete="current-password" required><button class="eye" type="button" data-toggle="loginPassword" aria-label="Afficher le mot de passe"><svg class="icon"><use href="#eye"/></svg></button></label>
  <div id="loginError" class="auth-error"></div>
  <button class="submit" type="submit">S'identifier</button>
  <button type="button" class="forgot" id="forgotPassword">Mot de passe oublié ?</button>
 </form></div>
</section>
<section id="splash" class="screen splash"><div class="brand"><svg class="brand-logo"><use href="#bt-logo"/></svg><div class="brand-name">BUILD<span>TRACE</span></div></div></section>
<script>
const $=id=>document.getElementById(id),KEY='buildtrace_demo_account_v2',SESSION='buildtrace_demo_session_v2';
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function error(id,msg){const e=$(id);e.textContent=msg;e.classList.add('show')}
function clearError(id){$(id).textContent='';$(id).classList.remove('show')}
function savedAccount(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch{return null}}
function launchApp(){show('splash');setTimeout(()=>{show('welcome')},850)}
$('startSignup').onclick=()=>show('signup');$('startLogin').onclick=()=>show('login');$('toLogin').onclick=()=>show('login');$('backFromLogin').onclick=()=>show('welcome');
document.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',()=>{const input=$(b.dataset.toggle);input.type=input.type==='password'?'text':'password';b.innerHTML='<svg class="icon"><use href="#'+(input.type==='password'?'eye':'eye-off')+'"/></svg>'}));
document.querySelectorAll('[data-provider]').forEach(b=>b.addEventListener('click',()=>alert('La connexion '+b.dataset.provider+' sera activée lors du branchement de Supabase Auth.')));
$('signupForm').addEventListener('submit',e=>{e.preventDefault();clearError('signupError');const email=$('signupEmail').value.trim().toLowerCase(),password=$('signupPassword').value;if(password.length<8){error('signupError','Le mot de passe doit contenir au moins 8 caractères.');return}if(savedAccount()?.email===email){error('signupError','Un compte de démonstration existe déjà. Connectez-vous.');return}localStorage.setItem(KEY,JSON.stringify({email,password}));localStorage.setItem(SESSION,'active');alert('Compte de démonstration créé. La connexion réelle sera activée avec Supabase.');launchApp()});
$('loginForm').addEventListener('submit',e=>{e.preventDefault();clearError('loginError');const account=savedAccount(),email=$('loginEmail').value.trim().toLowerCase(),password=$('loginPassword').value;if(!account||account.email!==email||account.password!==password){error('loginError','Adresse e-mail ou mot de passe incorrect.');return}localStorage.setItem(SESSION,'active');launchApp()});
$('forgotPassword').onclick=()=>alert('La récupération du mot de passe sera activée avec Supabase Auth.');
function init(){const account=savedAccount(),active=localStorage.getItem(SESSION)==='active';if(account&&active){launchApp()}else if(account){show('login')}else{show('welcome')}}
init();
</script>
</body></html>
