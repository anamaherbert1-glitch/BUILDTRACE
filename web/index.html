<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1C2C">
  <title>BUILDTRACE — Traçabilité • Réemploi • Construction durable</title>
  <style>
    :root {
      --navy: #0B1C2C;
      --navy-2: #12283A;
      --green: #00C853;
      --green-dark: #00A844;
      --white: #FFFFFF;
      --muted: rgba(255,255,255,0.78);
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--navy);
      color: var(--white);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ========== ÉCRAN 1 : PAGE D'ACCUEIL ========= */
    .screen-home {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      background:
        linear-gradient(180deg, rgba(11,28,44,0.55) 0%, rgba(11,28,44,0.82) 55%, rgba(11,28,44,0.95) 100%),
        url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1200&q=80") center/cover no-repeat;
    }

    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 24px 28px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    /* Logo */
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-align: center;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      background: var(--white);
      border-radius: 18px;
      display: grid;
      place-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }

    .logo-icon svg {
      width: 38px;
      height: 38px;
    }

    .logo-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: var(--white);
    }

    .logo-text span {
      color: var(--green);
    }

    .tagline {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.3px;
      margin-top: 2px;
    }

    /* Hero text */
    .hero {
      text-align: center;
      margin: 32px 0 28px;
    }

    .hero h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.4px;
      margin-bottom: 14px;
    }

    .hero p {
      font-size: 15px;
      line-height: 1.55;
      color: var(--muted);
      max-width: 340px;
      margin: 0 auto;
    }

    /* Buttons */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 54px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
      text-decoration: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--green);
      color: #003D1A;
      box-shadow: 0 6px 20px rgba(0,200,83,0.35);
    }

    .btn-primary:hover {
      background: var(--green-dark);
    }

    .btn-outline {
      background: transparent;
      color: var(--white);
      border: 1.5px solid rgba(255,255,255,0.35);
    }

    .btn-outline:hover {
      background: rgba(255,255,255,0.08);
    }

    /* Bottom quick actions */
    .quick-actions {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 36px;
      padding-bottom: 8px;
    }

    .quick-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
      background: none;
      border: none;
      cursor: pointer;
    }

    .quick-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: rgba(255,255,255,0.12);
      display: grid;
      place-items: center;
      color: var(--white);
      font-size: 20px;
    }

    .quick-item:hover .quick-icon {
      background: rgba(0,200,83,0.25);
      color: var(--green);
    }

    /* Safe area for notch phones */
    @supports (padding: max(0px)) {
      .home-content {
        padding-top: max(48px, env(safe-area-inset-top));
        padding-bottom: max(28px, env(safe-area-inset-bottom));
      }
    }

    /* Desktop centering */
    @media (min-width: 500px) {
      .screen-home {
        align-items: center;
        justify-content: center;
      }
      .home-content {
        border-radius: 24px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        min-height: 720px;
      }
    }
  </style>
</head>
<body>

  <!-- ========== ÉCRAN 1 : PAGE D'ACCUEIL ========== -->
  <div class="screen-home" id="screen-home">
    <div class="home-content">

      <!-- Logo -->
      <div class="logo">
        <div class="logo-icon">
          <!-- Icône maison + feuille (style mockup) -->
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 22L24 8L40 22V40C40 41.1 39.1 42 38 42H10C8.9 42 8 41.1 8 40V22Z" fill="#0B1C2C"/>
            <path d="M18 42V28H30V42" stroke="#00C853" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 8L8 22H40L24 8Z" fill="#00C853"/>
            <circle cx="32" cy="16" r="5" fill="#00C853" opacity="0.9"/>
          </svg>
        </div>
        <div class="logo-text">BUILD<span>TRACE</span></div>
        <div class="tagline">Traçabilité • Réemploi • Construction durable</div>
      </div>

      <!-- Hero -->
      <div class="hero">
        <h1>Des matériaux<br>plus durables pour<br>un avenir meilleur</h1>
        <p>Identifiez, suivez et réutilisez les matériaux de construction grâce à la blockchain et à l’intelligence artificielle.</p>
      </div>

      <!-- Actions -->
      <div>
        <div class="actions">
          <button class="btn btn-primary" onclick="alert('Écran 2 — Inscription / Connexion (à venir)')">
            Commencer gratuitement →
          </button>
          <button class="btn btn-outline" onclick="alert('Écran 2 — Connexion (à venir)')">
            Se connecter
          </button>
        </div>

        <!-- Quick actions bas de page -->
        <div class="quick-actions">
          <button class="quick-item">
            <div class="quick-icon">⬚</div>
            Scanner un QR
          </button>
          <button class="quick-item">
            <div class="quick-icon">🗺️</div>
            Carte
          </button>
          <button class="quick-item">
            <div class="quick-icon">🛒</div>
            Marketplace
          </button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
