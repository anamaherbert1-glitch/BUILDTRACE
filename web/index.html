<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1C2C">
  <title>BUILDTRACE — Traçabilité • Réemploi • Construction durable</title>
  <style>
    :root {
      --navy: #0B1C2C;
      --green: #00C853;
      --green-dark: #00A844;
      --green-light: #E6F7ED;
      --white: #FFFFFF;
      --bg: #F5F7F6;
      --ink: #1A2B22;
      --muted: #6B7C72;
      --line: #E0E7E3;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      overflow-x: hidden;
    }
    .screen { display: none; min-height: 100dvh; }
    .screen.active { display: flex; flex-direction: column; }

    /* ========== ÉCRAN 1 ========= */
    #screen-home {
      background:
        linear-gradient(180deg, rgba(8,20,32,0.45) 0%, rgba(8,20,32,0.75) 50%, rgba(8,20,32,0.92) 100%),
        url("https://images.unsplash.com/photo-1541888946425-d81bb19240f5?auto=format&fit=crop&w=1400&q=85") center 30%/cover no-repeat;
      color: var(--white);
    }
    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px 22px 22px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
    }
    .logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      padding-top: 12px;
    }
    .logo-icon {
      width: 58px; height: 58px;
      background: var(--white);
      border-radius: 16px;
      display: grid; place-items: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.28);
    }
    .logo-text { font-size: 24px; font-weight: 800; letter-spacing: 0.3px; }
    .logo-text span { color: var(--green); }
    .tagline { font-size: 12px; color: rgba(255,255,255,0.75); letter-spacing: 0.2px; }

    .hero { text-align: center; margin: 20px 0 18px; }
    .hero h1 {
      font-size: 26px; font-weight: 800; line-height: 1.22;
      letter-spacing: -0.3px; margin-bottom: 10px;
    }
    .hero p {
      font-size: 14px; line-height: 1.5;
      color: rgba(255,255,255,0.78); max-width: 320px; margin: 0 auto;
    }

    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn {
      display: flex; align-items: center; justify-content: center;
      height: 50px; border-radius: 12px; font-size: 15px; font-weight: 700;
      border: none; cursor: pointer; transition: transform .12s, background .12s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--green); color: #003D1A;
      box-shadow: 0 5px 16px rgba(0,200,83,0.35);
    }
    .btn-outline {
      background: transparent; color: var(--white);
      border: 1.5px solid rgba(255,255,255,0.4);
    }

    .quick-actions {
      display: flex; justify-content: center; gap: 22px;
      margin-top: 26px; padding-bottom: 4px;
    }
    .quick-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      color: rgba(255,255,255,0.8); font-size: 11px; font-weight: 500;
      background: none; border: none; cursor: pointer;
    }
    .quick-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(255,255,255,0.14);
      display: grid; place-items: center;
    }
    .quick-icon svg { width: 20px; height: 20px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* ========== ÉCRAN 2 ========= */
    #screen-auth { background: var(--white); color: var(--ink); }
    .auth-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
      padding: 16px 22px 18px;
    }
    .auth-header {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; margin-bottom: 14px; text-align: center;
    }
    .auth-logo {
      width: 48px; height: 48px;
      background: var(--green-light);
      border-radius: 14px;
      display: grid; place-items: center;
    }
    .auth-title { font-size: 20px; font-weight: 800; color: var(--navy); }

    .auth-tabs {
      display: flex; background: var(--bg);
      border-radius: 11px; padding: 3px; margin-bottom: 16px;
    }
    .auth-tab {
      flex: 1; height: 38px; border: none; background: transparent;
      border-radius: 9px; font-size: 14px; font-weight: 600;
      color: var(--muted); cursor: pointer;
    }
    .auth-tab.active {
      background: var(--white); color: var(--green);
      box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    }

    .form-group { margin-bottom: 10px; }
    .form-label {
      display: block; font-size: 12px; font-weight: 600;
      color: var(--muted); margin-bottom: 4px;
    }
    .form-input {
      width: 100%; height: 46px;
      border: 1.5px solid var(--line); border-radius: 11px;
      padding: 0 14px 0 42px; font-size: 14px; color: var(--ink);
      background: var(--white); outline: none;
    }
    .form-input:focus { border-color: var(--green); }
    .form-input::placeholder { color: #A3B0A9; }

    .input-with-icon { position: relative; }
    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--muted);
      pointer-events: none;
    }
    .input-icon svg {
      width: 18px; height: 18px; stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }
    .password-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; padding: 4px; cursor: pointer;
      color: var(--muted); display: grid; place-items: center;
    }
    .password-toggle svg {
      width: 18px; height: 18px; stroke: currentColor; fill: none;
      stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    }

    .checkbox-row {
      display: flex; align-items: flex-start; gap: 8px;
      margin: 4px 0 12px; font-size: 12px; color: var(--muted); line-height: 1.35;
    }
    .checkbox-row input {
      width: 16px; height: 16px; margin-top: 1px; accent-color: var(--green); flex-shrink: 0;
    }

    .btn-auth {
      width: 100%; height: 48px;
      background: var(--green); color: #003D1A;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,200,83,0.28);
    }

    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 14px 0; color: var(--muted); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ""; flex: 1; height: 1px; background: var(--line);
    }

    .social-btns { display: flex; flex-direction: column; gap: 8px; }
    .btn-social {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      height: 44px; border: 1.5px solid var(--line); border-radius: 11px;
      background: var(--white); font-size: 14px; font-weight: 600;
      color: var(--ink); cursor: pointer;
    }

    .auth-footer {
      text-align: center; margin-top: 14px;
      font-size: 13px; color: var(--muted);
    }
    .auth-footer a { color: var(--green); font-weight: 700; text-decoration: none; }

    .register-only { display: none; }
    .auth-mode-register .register-only { display: block; }

    @supports (padding: max(0px)) {
      .home-content, .auth-content {
        padding-top: max(16px, env(safe-area-inset-top));
        padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <!-- ========== ÉCRAN 1 ========== -->
  <div class="screen active" id="screen-home">
    <div class="home-content">
      <div class="logo">
        <div class="logo-icon">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10.5z" fill="#0B1C2C"/>
            <path d="M9 21V13h6v8" stroke="#00C853" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 3L3 10.5h18L12 3z" fill="#00C853"/>
          </svg>
        </div>
        <div class="logo-text">BUILD<span>TRACE</span></div>
        <div class="tagline">Traçabilité • Réemploi • Construction durable</div>
      </div>

      <div class="hero">
        <h1>Des matériaux<br>plus durables pour<br>un avenir meilleur</h1>
        <p>Identifiez, suivez et réutilisez les matériaux de construction grâce à la blockchain et à l’intelligence artificielle.</p>
      </div>

      <div>
        <div class="actions">
          <button class="btn btn-primary" onclick="showScreen('auth'); setAuthMode('register')">Commencer gratuitement →</button>
          <button class="btn btn-outline" onclick="showScreen('auth'); setAuthMode('login')">Se connecter</button>
        </div>
        <div class="quick-actions">
          <button class="quick-item">
            <div class="quick-icon">
              <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM18 14h3v3h-3zM14 18h3v3h-3zM18 18h3v3h-3z"/></svg>
            </div>
            Scanner un QR
          </button>
          <button class="quick-item">
            <div class="quick-icon">
              <svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            Carte
          </button>
          <button class="quick-item">
            <div class="quick-icon">
              <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            </div>
            Marketplace
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== ÉCRAN 2 ========== -->
  <div class="screen" id="screen-auth">
    <div class="auth-content auth-mode-register" id="auth-box">
      <div class="auth-header">
        <div class="auth-logo">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
            <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10.5z" fill="#0B1C2C"/>
            <path d="M9 21V13h6v8" stroke="#00C853" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 3L3 10.5h18L12 3z" fill="#00C853"/>
          </svg>
        </div>
        <div class="auth-title">BUILDTRACE</div>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab" id="tab-login" onclick="setAuthMode('login')">Connexion</button>
        <button class="auth-tab active" id="tab-register" onclick="setAuthMode('register')">Inscription</button>
      </div>

      <form onsubmit="return handleAuth(event)">
        <div class="form-group register-only">
          <label class="form-label">Nom complet</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
            <input class="form-input" type="text" placeholder="Votre nom complet" id="fullName">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
            <input class="form-input" type="email" placeholder="email@exemple.com" id="email" required>
          </div>
        </div>

        <div class="form-group register-only">
          <label class="form-label">Téléphone</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg></span>
            <input class="form-input" type="tel" placeholder="+228 XX XX XX XX" id="phone">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-with-icon">
            <span class="input-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
            <input class="form-input" type="password" placeholder="••••••••" id="password" required style="padding-right:42px">
            <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Afficher le mot de passe">
              <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="checkbox-row register-only">
          <input type="checkbox" id="terms" checked>
          <label for="terms">J’accepte les conditions d’utilisation et la politique de confidentialité</label>
        </div>

        <button type="submit" class="btn-auth" id="auth-submit">Créer mon compte</button>
      </form>

      <div class="divider">ou</div>

      <div class="social-btns">
        <button class="btn-social" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continuer avec Google
        </button>
        <button class="btn-social" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          Continuer avec Apple
        </button>
      </div>

      <div class="auth-footer" id="auth-footer">
        Vous avez déjà un compte ? <a href="#" onclick="setAuthMode('login'); return false;">Se connecter</a>
      </div>
    </div>
  </div>

  <script>
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + id).classList.add('active');
      window.scrollTo(0, 0);
    }
    function setAuthMode(mode) {
      const box = document.getElementById('auth-box');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const submit = document.getElementById('auth-submit');
      const footer = document.getElementById('auth-footer');
      if (mode === 'register') {
        box.classList.remove('auth-mode-login');
        box.classList.add('auth-mode-register');
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        submit.textContent = 'Créer mon compte';
        footer.innerHTML = 'Vous avez déjà un compte ? <a href="#" onclick="setAuthMode(\'login\'); return false;">Se connecter</a>';
      } else {
        box.classList.remove('auth-mode-register');
        box.classList.add('auth-mode-login');
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        submit.textContent = 'Se connecter';
        footer.innerHTML = 'Pas encore de compte ? <a href="#" onclick="setAuthMode(\'register\'); return false;">Créer un compte</a>';
      }
    }
    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }
    function handleAuth(e) {
      e.preventDefault();
      const mode = document.getElementById('auth-box').classList.contains('auth-mode-register') ? 'register' : 'login';
      alert(mode === 'register' ? 'Inscription (à brancher sur l’API)' : 'Connexion (à brancher sur l’API)');
      return false;
    }
  </script>
</body>
</html>
