<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1C2C">
  <title>BUILDTRACE — Traçabilité • Réemploi • Construction durable</title>
  <style>
    :root {
      --navy: #0B1C2C;
      --navy-2: #12283A;
      --green: #00C853;
      --green-dark: #00A844;
      --green-light: #E8F8EF;
      --white: #FFFFFF;
      --bg: #F7F9F8;
      --ink: #1A2B22;
      --muted: #6B7C72;
      --line: #E2E9E5;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    .screen { display: none; min-height: 100dvh; }
    .screen.active { display: flex; flex-direction: column; }

    /* ========== ÉCRAN 1 : PAGE D'ACCUEIL ========= */
    #screen-home {
      background:
        linear-gradient(180deg, rgba(11,28,44,0.55) 0%, rgba(11,28,44,0.82) 55%, rgba(11,28,44,0.95) 100%),
        url("https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=1200&q=80") center/cover no-repeat;
      color: var(--white);
    }

    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 24px 28px;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
    }

    .logo { display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; }
    .logo-icon {
      width: 64px; height: 64px; background: var(--white); border-radius: 18px;
      display: grid; place-items: center; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    }
    .logo-icon svg { width: 38px; height: 38px; }
    .logo-text { font-size: 26px; font-weight: 800; letter-spacing: 0.5px; }
    .logo-text span { color: var(--green); }
    .tagline { font-size: 13px; color: rgba(255,255,255,0.78); letter-spacing: 0.3px; }

    .hero { text-align: center; margin: 32px 0 28px; }
    .hero h1 { font-size: 28px; font-weight: 800; line-height: 1.25; letter-spacing: -0.4px; margin-bottom: 14px; }
    .hero p { font-size: 15px; line-height: 1.55; color: rgba(255,255,255,0.78); max-width: 340px; margin: 0 auto; }

    .actions { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      height: 54px; border-radius: 14px; font-size: 16px; font-weight: 700;
      border: none; cursor: pointer; transition: transform 0.15s, background 0.15s; text-decoration: none;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: var(--green); color: #003D1A; box-shadow: 0 6px 20px rgba(0,200,83,0.35); }
    .btn-primary:hover { background: var(--green-dark); }
    .btn-outline { background: transparent; color: var(--white); border: 1.5px solid rgba(255,255,255,0.35); }
    .btn-outline:hover { background: rgba(255,255,255,0.08); }

    .quick-actions { display: flex; justify-content: center; gap: 28px; margin-top: 36px; padding-bottom: 8px; }
    .quick-item {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.78); font-size: 12px; font-weight: 500;
      background: none; border: none; cursor: pointer;
    }
    .quick-icon {
      width: 48px; height: 48px; border-radius: 14px; background: rgba(255,255,255,0.12);
      display: grid; place-items: center; color: var(--white); font-size: 20px;
    }

    /* ========== ÉCRAN 2 : INSCRIPTION / CONNEXION ========= */
    #screen-auth {
      background: var(--white);
      color: var(--ink);
    }

    .auth-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      width: 100%;
      padding: 28px 24px 32px;
    }

    .auth-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      text-align: center;
    }

    .auth-logo {
      width: 56px; height: 56px; background: var(--green-light); border-radius: 16px;
      display: grid; place-items: center;
    }
    .auth-logo svg { width: 32px; height: 32px; }

    .auth-title {
      font-size: 22px; font-weight: 800; color: var(--navy); letter-spacing: -0.3px;
    }

    /* Tabs Connexion / Inscription */
    .auth-tabs {
      display: flex;
      background: var(--bg);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 28px;
    }
    .auth-tab {
      flex: 1;
      height: 42px;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-tab.active {
      background: var(--white);
      color: var(--green);
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Form */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      height: 52px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 0 16px;
      font-size: 15px;
      color: var(--ink);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--green); }
    .form-input::placeholder { color: #A0AFA8; }

    .input-with-icon {
      position: relative;
    }
    .input-with-icon .form-input { padding-left: 46px; }
    .input-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      padding: 4px;
    }

    .checkbox-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 8px 0 22px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.4;
    }
    .checkbox-row input {
      width: 18px; height: 18px; margin-top: 1px; accent-color: var(--green);
    }

    .btn-auth {
      width: 100%;
      height: 54px;
      background: var(--green);
      color: #003D1A;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,200,83,0.28);
    }
    .btn-auth:hover { background: var(--green-dark); }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 13px;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .social-btns { display: flex; flex-direction: column; gap: 10px; }
    .btn-social {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      height: 50px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      background: var(--white);
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }
    .btn-social:hover { background: var(--bg); }

    .auth-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 14px;
      color: var(--muted);
    }
    .auth-footer a {
      color: var(--green);
      font-weight: 700;
      text-decoration: none;
    }

    /* Hide/show form fields based on mode */
    .register-only { display: none; }
    .auth-mode-register .register-only { display: block; }
    .auth-mode-login .login-only { display: block; }

    @supports (padding: max(0px)) {
      .home-content, .auth-content {
        padding-top: max(28px, env(safe-area-inset-top));
        padding-bottom: max(28px, env(safe-area-inset-bottom));
      }
    }

    @media (min-width: 500px) {
      #screen-home { align-items: center; justify-content: center; }
      .home-content {
        border-radius: 24px; overflow: hidden;
        box-shadow: 0 20px 60px rgba(0,0,0,0.4); min-height: 720px;
      }
      #screen-auth { align-items: center; }
      .auth-content {
        border-radius: 24px;
        box-shadow: 0 12px 40px rgba(0,0,0,0.08);
        margin: 24px auto;
      }
    }
  </style>
</head>
<body>

  <!-- ========== ÉCRAN 1 : PAGE D'ACCUEIL ========== -->
  <div class="screen active" id="screen-home">
    <div class="home-content">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 22L24 8L40 22V40C40 41.1 39.1 42 38 42H10C8.9 42 8 41.1 8 40V22Z" fill="#0B1C2C"/>
            <path d="M18 42V28H30V42" stroke="#00C853" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 8L8 22H40L24 8Z" fill="#00C853"/>
            <circle cx="32" cy="16" r="5" fill="#00C853" opacity="0.9"/>
          </svg>
        </div>
        <div class="logo-text">BUILD<span>TRACE</span></div>
        <div class="tagline">Traçabilité • Réemploi • Construction durable</div>
      </div>

      <div class="hero">
        <h1>Des matériaux<br>plus durables pour<br>un avenir meilleur</h1>
        <p>Identifiez, suivez et réutilisez les matériaux de construction grâce à la blockchain et à l’intelligence artificielle.</p>
      </div>

      <div>
        <div class="actions">
          <button class="btn btn-primary" onclick="showScreen('auth'); setAuthMode('register')">
            Commencer gratuitement →
          </button>
          <button class="btn btn-outline" onclick="showScreen('auth'); setAuthMode('login')">
            Se connecter
          </button>
        </div>
        <div class="quick-actions">
          <button class="quick-item"><div class="quick-icon">⬚</div>Scanner un QR</button>
          <button class="quick-item"><div class="quick-icon">🗺️</div>Carte</button>
          <button class="quick-item"><div class="quick-icon">🛒</div>Marketplace</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== ÉCRAN 2 : INSCRIPTION / CONNEXION ========== -->
  <div class="screen" id="screen-auth">
    <div class="auth-content auth-mode-register" id="auth-box">

      <div class="auth-header">
        <div class="auth-logo">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M8 22L24 8L40 22V40C40 41.1 39.1 42 38 42H10C8.9 42 8 41.1 8 40V22Z" fill="#0B1C2C"/>
            <path d="M18 42V28H30V42" stroke="#00C853" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M24 8L8 22H40L24 8Z" fill="#00C853"/>
          </svg>
        </div>
        <div class="auth-title">BUILDTRACE</div>
      </div>

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab" id="tab-login" onclick="setAuthMode('login')">Connexion</button>
        <button class="auth-tab active" id="tab-register" onclick="setAuthMode('register')">Inscription</button>
      </div>

      <!-- Formulaire -->
      <form onsubmit="return handleAuth(event)">
        <div class="form-group register-only">
          <label class="form-label">Nom complet</label>
          <div class="input-with-icon">
            <span class="input-icon">👤</span>
            <input class="form-input" type="text" placeholder="Votre nom complet" id="fullName">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-with-icon">
            <span class="input-icon">✉️</span>
            <input class="form-input" type="email" placeholder="email@exemple.com" id="email" required>
          </div>
        </div>

        <div class="form-group register-only">
          <label class="form-label">Téléphone</label>
          <div class="input-with-icon">
            <span class="input-icon">📱</span>
            <input class="form-input" type="tel" placeholder="+228 XX XX XX XX" id="phone">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Mot de passe</label>
          <div class="input-with-icon">
            <span class="input-icon">🔒</span>
            <input class="form-input" type="password" placeholder="••••••••" id="password" required style="padding-right:48px">
            <button type="button" class="password-toggle" onclick="togglePassword()">👁️</button>
          </div>
        </div>

        <div class="checkbox-row register-only">
          <input type="checkbox" id="terms" checked>
          <label for="terms">J’accepte les conditions d’utilisation et la politique de confidentialité</label>
        </div>

        <button type="submit" class="btn-auth" id="auth-submit">Créer mon compte</button>
      </form>

      <div class="divider">ou</div>

      <div class="social-btns">
        <button class="btn-social" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continuer avec Google
        </button>
        <button class="btn-social" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
          Continuer avec Apple
        </button>
      </div>

      <div class="auth-footer" id="auth-footer">
        Vous avez déjà un compte ? <a href="#" onclick="setAuthMode('login'); return false;">Se connecter</a>
      </div>

    </div>
  </div>

  <script>
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById('screen-' + id).classList.add('active');
      window.scrollTo(0, 0);
    }

    function setAuthMode(mode) {
      const box = document.getElementById('auth-box');
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const submit = document.getElementById('auth-submit');
      const footer = document.getElementById('auth-footer');

      if (mode === 'register') {
        box.classList.remove('auth-mode-login');
        box.classList.add('auth-mode-register');
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        submit.textContent = 'Créer mon compte';
        footer.innerHTML = 'Vous avez déjà un compte ? <a href="#" onclick="setAuthMode(\'login\'); return false;">Se connecter</a>';
      } else {
        box.classList.remove('auth-mode-register');
        box.classList.add('auth-mode-login');
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        submit.textContent = 'Se connecter';
        footer.innerHTML = 'Pas encore de compte ? <a href="#" onclick="setAuthMode(\'register\'); return false;">Créer un compte</a>';
      }
    }

    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function handleAuth(e) {
      e.preventDefault();
      const mode = document.getElementById('auth-box').classList.contains('auth-mode-register') ? 'register' : 'login';
      alert(mode === 'register' ? 'Inscription (à brancher sur l’API)' : 'Connexion (à brancher sur l’API)');
      return false;
    }
  </script>
</body>
</html>
