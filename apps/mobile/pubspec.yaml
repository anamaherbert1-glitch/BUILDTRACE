name: buildtrace
description: BUILDTRACE - Passeport numérique et réemploi des matériaux de construction
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Navigation
  go_router: ^14.6.0
  # State management
  flutter_riverpod: ^2.6.1
  # Network
  dio: ^5.7.0
  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.14
  cached_network_image: ^3.4.1
  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  image_picker: ^1.1.2
  # Interactive map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
